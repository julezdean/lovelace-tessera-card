name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release flow tags only after CI is green, so it has to be possible to
  # run this on demand rather than waiting for an unrelated push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Formatting, lint, types, the build and the tests -- the same command used
      # locally, so a green CI means the same thing as a green working copy.
      - run: npm run check

      # HACS ships exactly one file, and Home Assistant loads exactly one
      # resource. A second chunk would never be deployed.
      - name: The bundle must be a single file
        run: |
          count=$(find dist -type f -name '*.js' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one bundle in dist/, found $count."
            find dist -type f
            exit 1
          fi
          echo "Bundle: $(find dist -type f -name '*.js') ($(wc -c < "$(find dist -type f -name '*.js')") bytes)"

